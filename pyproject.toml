[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prepublish-audit"
version = "0.1.0"
description = "A pre-publish gate that stops secrets and internal information from leaving when you open-source a repo, publish a site or share a bundle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "DEEGITECH" }]
keywords = [
  "security",
  "secrets",
  "secret-scanning",
  "data-leak",
  "dlp",
  "open-source",
  "pre-commit",
  "sarif",
  "git-history",
  "metadata",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Python 3.10 has no tomllib; tomli lets it read TOML configs and denylists.
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=8", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
prepublish-audit = "prepublish_audit.cli:main"

[project.urls]
Homepage = "https://github.com/deegitech/prepublish-audit"
Documentation = "https://github.com/deegitech/prepublish-audit#readme"
Issues = "https://github.com/deegitech/prepublish-audit/issues"
Changelog = "https://github.com/deegitech/prepublish-audit/blob/main/CHANGELOG.md"
Security = "https://github.com/deegitech/prepublish-audit/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/prepublish_audit"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "examples/",
  "scripts/",
  ".github/",
  "action.yml",
  ".pre-commit-hooks.yaml",
  ".prepublish-audit.toml",
  "README.md",
  "README.tr.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "SECURITY.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

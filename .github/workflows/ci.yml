name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Tests (standard-library unittest runner)
        run: python -m unittest discover -s tests -t .

  self-audit:
    name: Audit this repository with itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Built-in rules over files and full history
        # --fail-on on the command line: a pull request cannot relax this step through the config.
        run: PYTHONPATH=src python -m prepublish_audit scan --history --gitleaks never --fail-on warning .
      - name: Composite action (as users run it, built-in rules only)
        # Pull requests run the action code from their own branch, so this job
        # never receives a denylist secret. See the denylist-audit job below.
        uses: ./
        with:
          history: "true"
          gitleaks: never
          sarif-file: prepublish-audit.sarif

  denylist-audit:
    name: Audit with the repository denylist
    # Never on pull requests: their branch could change the action script and
    # print the secret. Runs on pushes to main and on manual runs, in the
    # "denylist-audit" environment: give it required reviewers and a small
    # denylist made for this repository (never an organisation-wide list).
    if: github.event_name != 'pull_request' && github.repository == 'deegitech/prepublish-audit'
    runs-on: ubuntu-latest
    environment: denylist-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Denylist, built-in rules and full history
        uses: ./
        with:
          history: "true"
          gitleaks: never
          fail-on: warning
          denylist: ${{ secrets.PREPUBLISH_DENYLIST }}

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner .'
